name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv sync
      - run: uv run ruff check pipeline scripts
      - run: uv run pytest
      - run: uv run python scripts/gerar_fontes.py
      - run: uv run python scripts/gerar_schema.py
      - run: uv run python scripts/validar_dados.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
