[project]
name = "praca-pipeline"
version = "0.1.0"
description = "Contratos e pipeline de dados públicos do projeto Praça"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["pipeline/src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
